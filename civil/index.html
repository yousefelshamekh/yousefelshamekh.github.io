:root[data-theme=dark]{--paper:#111316;--paper2:#16191D;--card:#1A1D21;--ink:#ECE8E1;--ink2:#A2A6AB;--ink3:#767B81;--line:#2B3036;--acc:#FF7C35;--acc-s:#3A2418;--blue:#79A8EA;--blue-s:#172235;--yel:#F5C23C;--yel-s:#3A3014;--grn:#5DBB84;--grn-s:#15301F;--red:#F0685C;--red-s:#3B1A17;--grid:rgba(121,168,234,.09);--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6);--sh2:0 2px 6px rgba(0,0,0,.5),0 18px 40px -12px rgba(0,0,0,.7);--soil:#6E5638;--soil2:#8A6C46;--conc:#4A4D52;--steel:#8E99A6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Alex,'Segoe UI',Tahoma,sans-serif;font-size:15.5px;line-height:1.9;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.en{direction:ltr;unicode-bidi:isolate;font-family:Changa,Alex,sans-serif;font-weight:500;color:var(--blue)}
.num{direction:ltr;unicode-bidi:isolate;font-family:Changa,sans-serif}
.k{font-family:Kufam,Alex,sans-serif}
b,strong{font-weight:700}
.muted{color:var(--ink2)}
/* top bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ibtn{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--paper);flex:none}
.ibtn svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;left:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font:600 12px/20px Changa;text-align:center}
.brand{font-family:Kufam;font-weight:800;font-size:17px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal;font:700 12px Changa}
.crumbs{flex:1;min-width:0;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a:hover{color:var(--acc)}
.miniring{width:34px;height:34px;flex:none}
/* layout */
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);border:1px solid var(--line);padding:22px;position:relative;min-width:0}
.hero{display:grid;grid-template-columns:var(--hcols);gap:16px}
h1{font-family:Kufam;font-weight:800;font-size:29px;line-height:1.4;margin:6px 0 8px}
h2{font-family:Kufam;font-weight:700;font-size:21px;line-height:1.5;margin:0 0 6px}
h3{font-family:Kufam;font-weight:700;font-size:17px;line-height:1.5;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 13px Changa,Alex;padding:3px 12px;border-radius:99px;background:var(--blue-s);color:var(--blue);white-space:nowrap}
.pill.o{background:var(--acc-s);color:var(--acc)}.pill.g{background:var(--grn-s);color:var(--grn)}.pill.r{background:var(--red-s);color:var(--red)}.pill.y{background:var(--yel-s);color:color-mix(in srgb,var(--yel) 60%,var(--ink))}.pill.n{background:var(--paper);color:var(--ink2)}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:var(--paper);border-radius:14px;padding:8px 14px;min-width:84px}
.stat b{font:700 24px/1.15 Changa;display:block;direction:ltr;text-align:right}
.stat span{font-size:12px;color:var(--ink2)}
.bp{background-color:var(--blue-s);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);border-radius:12px;padding:9px 18px;font:700 14px Kufam;min-height:42px;transition:transform .15s,filter .15s}
.btn.o{background:var(--acc);color:#fff}.btn.g{background:var(--grn);color:#fff}.btn.l{background:var(--paper);color:var(--ink);border:1px solid var(--line)}.btn.sm{min-height:34px;padding:5px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.resume{display:flex;gap:16px;align-items:center;margin-top:16px}
.ring{width:92px;height:92px;flex:none}
.partbars{display:grid;grid-template-columns:var(--split);gap:10px;margin-top:10px}
.pbar{background:var(--paper);border-radius:12px;padding:8px 12px;font-size:13px}
.pbar .t{display:flex;justify-content:space-between;gap:8px}
.track{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.track i{display:block;height:100%;background:var(--grn);border-radius:9px;transition:width .6s}
.grid6{display:grid;grid-template-columns:var(--g6);gap:14px;margin-top:16px}
.tile{display:flex;flex-direction:column;gap:6px;transition:transform .18s,box-shadow .18s;cursor:pointer;text-align:start}
@media (hover:hover){.tile:hover,.lrow:hover,.chcard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}.btn:hover{filter:brightness(1.08)}}
@media (hover:none){.tile:active,.lrow:active,.chcard:active,.btn:active{transform:scale(.985)}}
.tile .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--acc-s);color:var(--acc)}
.tile .ic svg{width:24px;height:24px}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px}
.tile p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.7}
.chstrip{display:flex;gap:4px;margin-top:8px;align-items:center}
.chstrip i{flex:1;height:8px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.chstrip i b{position:absolute;inset:0 auto 0 0;background:var(--grn);border-radius:9px}
[dir=rtl] .chstrip i b{inset:0 0 0 auto}
.chstrip .mid{width:3px;height:18px;border-radius:3px;background:var(--acc);flex:none}
.dim{display:flex;align-items:center;gap:10px;margin:28px 0 14px;color:var(--ink2);font:600 13px Changa,Alex;letter-spacing:.04em}
.dim:before,.dim:after{content:"";flex:1;height:1px;background:var(--ink2);opacity:.4}
.dim b{border:1.5px solid color-mix(in srgb,var(--ink2) 60%,transparent);border-radius:99px;padding:1px 12px;font-weight:600}
/* chapters */
.chlist{display:grid;gap:12px}
.chcard{display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .18s,box-shadow .18s}
.chnum{width:52px;height:52px;border-radius:15px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 22px Changa;flex:none}
.chcard.done .chnum{background:var(--grn)}
.chcard .body{flex:1;min-width:0}
.opener{display:grid;grid-template-columns:var(--split);gap:16px;align-items:center}
.modes{display:grid;grid-template-columns:var(--split);gap:12px;margin:16px 0}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:start;cursor:pointer;padding:16px;border-radius:16px;background:var(--paper);border:1.5px solid transparent;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--acc)}
.mode .ic{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--acc);flex:none}
.lrows{display:grid;gap:10px}
.lrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:start;width:100%}
.lrow .id{font:700 15px Changa;color:var(--acc);min-width:34px;direction:ltr}
.lrow .t{flex:1;min-width:0}
.lrow .t small{display:block;color:var(--ink2);font-size:12.5px}
.lrow .st{flex:none}
.check{width:26px;height:26px;border-radius:99px;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.check.on{background:var(--grn);border-color:var(--grn)}
.check.half{border-color:var(--acc);background:conic-gradient(var(--acc) var(--p,50%),transparent 0)}
/* lesson */
.lchips{position:sticky;top:64px;z-index:30;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:0 -2px 10px;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);scrollbar-width:none}
.lchips::-webkit-scrollbar{display:none}
.lchip{flex:none;font:600 13px Changa,Alex;padding:5px 12px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);white-space:nowrap;direction:ltr}
.lchip.done{border-color:var(--grn);color:var(--grn)}
.lchip.cur{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lesson{margin-bottom:22px}
.lhead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lhead .n{font:700 22px Changa;color:var(--acc);direction:ltr}
.lhead .tt{flex:1;min-width:0}
.lhead .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.lbody{margin-top:12px}
.lbody p{margin:10px 0}
.lead{font-size:16.5px;line-height:1.95;background:var(--paper);border-radius:14px;padding:12px 16px;border-inline-start:4px solid var(--blue)}
.lbody h3{margin:22px 0 6px;display:flex;align-items:center;gap:8px}
.lbody h3:before{content:"";width:14px;height:3px;border-radius:3px;background:var(--acc)}
ul.pts{margin:8px 0;padding:0;list-style:none;display:grid;gap:6px}
ul.pts li{position:relative;padding-inline-start:22px}
ul.pts li:before{content:"";position:absolute;inset-inline-start:4px;top:.75em;width:8px;height:8px;border-radius:2px;background:var(--acc);transform:rotate(45deg)}
.codeln{direction:ltr;text-align:left;font-family:Changa,monospace;background:var(--paper);border-radius:10px;padding:7px 12px;margin:6px 0;font-size:14.5px;line-height:1.7;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.codeln .cm{color:var(--ink2);direction:rtl;unicode-bidi:isolate;font-family:Alex;font-size:13.5px}
.codeblk{direction:ltr;text-align:left;font-family:Changa,monospace;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;margin:10px 0;font-size:14.5px;line-height:1.75;overflow-x:auto;white-space:pre}
.codeblk .cm{color:#9aa0a6}
.outbtn{margin-top:-4px}
.out{direction:ltr;text-align:left;font-family:Changa;background:var(--grn-s);color:var(--ink);border-radius:12px;padding:8px 14px;white-space:pre-wrap;margin:6px 0}
.rule{display:grid;grid-template-columns:var(--rcols,minmax(0,1fr) minmax(0,1.3fr));gap:12px;align-items:stretch;margin:14px 0}
.rule .f{background:var(--ink);color:var(--paper);border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.rule .f .fx{direction:ltr;font:600 19px/1.6 Changa;text-align:center}

  {t:'rule',f:'ΣFx = 0   ·   ΣFy = 0   ·   ΣM = 0',s:'3 معادلات اتزان لأي جسم في مستوى',head:['المرحلة','الشرط'],rows:[['1) Equilibrium phase','ΣFx = 0 , ΣFy = 0 , ΣM = 0'],['2) Stability phase','No. of equations = No. of unknowns · الحركات لازم تتمنع (supports)']]},
  {t:'p',x:['التسلسل في السلايد: **Loads → on Structure → Analysis → Response** (internal actions N, M, Q + deformations) **→ Design**.']},

  {t:'trap',title:'2L/3 من أنهي ناحية؟',x:['المحصلة بتقع **ناحية الجزء التقيل**: 2L/3 من **الطرف اللي الحمل فيه صفر**، يعني L/3 من الطرف الكبير.','$ triangle 0 → 3 t/m over 6 m :  R = 3×6/2 = 9 t  at 4 m from zero end','أي غلطة في مكان المحصلة بتبوّظ كل معادلات العزوم بعدها.']},
  {t:'viz',v:'seesaw'},
  {"t": "tip", "title": "إشارة العزم: إزاي تحدد كل حد", "x": ["اختار اتجاه موجب للمعادلة (مثلًا **clockwise +**) وامشي عليه في **كل الحدود**. تقدر تختار العكس في المعادلة اللي بعدها، المهم الاتجاه ميتغيرش جوه نفس المعادلة.", "عشان تعرف اتجاه أي حد: تخيّل إن النقطة اللي بتاخد العزوم حواليها **مسمار**، وشوف القوة هتلف الكمرة حواليه في أنهي اتجاه.", "$ down force RIGHT of the point  →  clockwise", "$ down force LEFT of the point   →  anticlockwise", "$ up force  →  the opposite of the two lines above", "$ force to the right ABOVE the point  →  clockwise ;  BELOW the point  →  anticlockwise", "الذراع = **المسافة العمودية** بين خط عمل القوة والنقطة. أي قوة خط عملها **بيعدّي من النقطة** عزمها صفر: عشان كده بناخد العزوم حوالين support فيه مجاهيل كتير، وعشان كده القوى الأفقية اللي ماشية على محور الكمرة نفسه ملهاش عزم حوالين أي نقطة على الكمرة.", "في **ΣY** و **ΣX** نفس الفكرة: اختار اتجاه موجب (مثلًا لفوق أو لليمين) واكتب كل قوة بإشارتها."]}
 ]},

  {t:'h',x:'Link member'},
  {t:'ps',x:['شرطين: **مفيش أحمال جانبية على طوله** + **طرفيه hinges**.','بيشيل **قوة محورية بس** في اتجاهه: **Strut** (ضغط) أو **Tie** (شد).','فلو مايل 45° → المركبة الأفقية = الرأسية (هنستخدمها في Example 11).']},
  {t:'h',x:'Intermediate hinge'},
  {t:'ps',x:['مفصل **جوا** الكمرة/الفريم: **العزم عنده = صفر**، والدوران قبله غير بعده.','بيدّيك **معادلة زيادة**: ΣM حوالين الـ hinge لجزء واحد بس = 0.','مثال من السلايد: **Cantilever plate girder bridge**.']},
  {t:'trap',title:'المعادلة الزيادة من الـ hinge',x:['الغلط المشهور: تاخد ΣM حوالين الـ hinge للفريم **كله** → هتطلع 0 = 0 ومش هتستفيد. لازم تاخد **جزء واحد بس** (يمين أو شمال الـ hinge).','$ ΣMd (left part only) = 0   ✓      ΣMd (whole frame) = 0   ✗ useless','عدّ: مجاهيل = 3 + عدد الـ hinges الداخلية → المنشأ statically determinate.']},

 {id:'3-3',ar:'ردود أفعال الكمرات البسيطة',en:'Reactions of simple beams (Example 1)',slides:'79',mins:7,blocks:[

  {t:'viz',v:'solveEx1'},
  {t:'trap',title:'الحمل المايل',x:['مايل بميل 3 : 4 (مثلث 3-4-5): المركبة اللي **قصاد** الـ 4 = P × 4/5، واللي قصاد الـ 3 = P × 3/5.','$ 10 t → vertical 10×4/5 = 8 t , horizontal 10×3/5 = 6 t','$ 15 t → vertical 12 t , horizontal 9 t','الأفقي هو اللي بيدّيك **Xa** — ومن غيره هتقول Xa = 0 غلط.']},
  {t:'tip',title:'Check دايمًا',x:['بعد ما تجيب Ya و Yb بالعزوم، عوّض في **ΣY = 0**. لو مطلعش صفر → فيه غلطة في ذراع أو إشارة.','$ 4 − 11.6 + 8 + 12 − 14.4 + 2 = 0  ✓']},
  {"t": "tip", "title": "فرض الاتجاه والإشارة السالبة", "x": ["اتجاه المجهول مش معروف قبل الحل، فبنفرضه (عادةً Y لفوق و X لليمين) ونكمل عادي.", "لو الناتج طلع **موجب** يبقى الفرض صح. لو طلع **سالب** يبقى الاتجاه الحقيقي **عكس** الفرض، والرقم نفسه صح.", "$ Ya = −3.5 (assumed ↑)  ⇒  Ya = 3.5 t ↓", "لما تستخدم القوة دي في معادلة بعدها أو تنقلها لجزء تاني: يا إما تكتبها بإشارتها السالبة مع الاتجاه المفروض، يا إما تكتبها موجبة مع اتجاهها الحقيقي. **متعملش الاتنين مع بعض** عشان متعكسهاش مرتين."]}
 ]},
 {id:'3-4',ar:'كمرات فيها intermediate hinges',en:'Compound beams (Examples 6, 7 & Midterm B)',slides:'80–81',mins:10,blocks:[
  {t:'lead',x:'الـ hinge الداخلي بيقسم الكمرة لأجزاء. **ابدأ بالجزء المعلّق** (اللي محمول على hinge من ناحية أو الناحيتين) — بعدين انقل القوة اللي عند الـ hinge للجزء التاني **بالاتجاه العكسي**.'},
  {"t": "tip", "title": "قوة الـ hinge بتتنقل إزاي؟", "x": ["الـ intermediate hinge بينقل قوة بين الجزئين اللي على جنبيه (ومش بينقل عزم). القوة دي **فعل ورد فعل**: نفس المقدار على الجزئين، و**عكس الاتجاه** على كل جزء.", "الخطوات: **(1)** ابدأ بالجزء المعلّق، وافرض قوة كل مفصل عليه **لفوق**. **(2)** حلّه بـ ΣM و ΣY. **(3)** انقل كل قوة للجزء التاني اللي على **نفس المفصل** **بالعكس**. **(4)** كمّل على الجزء التاني كأن القوة دي حمل عادي عليه.", "$ Example 6 :  on cd  Yc = 6 t ↑   →   on abc  6 t ↓  at c"]},
  {t:'viz',v:'solveEx6'},
  {t:'trap',title:'عزم لوحده على جزء',x:['في Example 6 الجزء cd عليه **عزم بس** (12 mt). العزم لوحده (couple) مايتقاومش غير بـ couple: قوتين **متساويتين ومتعاكستين**.','$ Yc = Yd = 12 / 2 = 6 t   (opposite directions)','يعني رد فعل d طالع **لتحت** — مش غلط.']},
  {t:'viz',v:'solveMB'},
  {"t": "exam", "title": "Midterm (B) · Q2 — 10 marks", "x": ["الكمرة دي بالظبط كانت مسألة الميد (B). الجزء **ef** بين مفصلين، فقوتين المفصلين عليه **لفوق**، وبيتنقلوا **لتحت** على abe عند e و على fcd عند f.", "$ on ef :  Ye = 9.33 t ↑ , Yf = 7.67 t ↑   →   9.33 t ↓ on abe , 7.67 t ↓ on fcd", "خلي بالك: **Ya** و **Yd** طالعين **بالسالب** (لتحت). ده عادي لما يبقى فيه جزء تقيل بعد الـ support (overhang): بيلف الكمرة حوالين الـ support وبيرفع الطرف التاني، فالطرف ده لازم يتشد لتحت.", "$ Ya = 3.5 t ↓ · Yb = 40.83 t ↑ · Yc = 37.92 t ↑ · Yd = 2.25 t ↓ · Xa = 0"]},
  {t:'viz',v:'solveEx7'},
  {"t": "trap", "title": "الجزء اللي بين مفصلين: الاتنين لتحت على اللي جنبه", "x": ["الجزء المعلّق بين 2 hinges (زي **fg** في Example 7، أو **ef** في ميد B) متسند على الجزئين اللي جنبه من الناحيتين، فالمفصلين **الاتنين بيزقّوه لفوق**.", "$ part fg :  load 2×3 = 6 t  →  Yf = 3 t ↑ , Yg = 3 t ↑     (3 + 3 = 6 ✓)", "العكس بيكون عند **نفس المفصل** بين الجزئين اللي بيلمسوا بعض، **مش بين f و g**:", "$ hinge g :  on fg = 3 t ↑   →   on gcd = 3 t ↓", "$ hinge f :  on fg = 3 t ↑   →   on ebf = 3 t ↓", "عشان كده هتلاقي الـ 3t **لتحت** على gcd (في ΣMc الحد 3×2 داخل **بالسالب**) و**لتحت** على ebf (في ΣMe الحد 3×5 داخل **بالموجب**). زي لوح شايله اتنين على كتافهم: الاتنين حاسين بوزنه لتحت.", "لو فرضت Yf لتحت على fg، الـ ΣY مش هتتظبط: هتحتاج Yg = 9 t، والعزوم حوالين g مش هتتزن."]},
  {t:'tip',title:'الـ fixed support = 3 مجاهيل',x:['في Example 7 الطرف a **fixed** → Xa و Ya و **Ma**. العزم Ma بنجيبه في الآخر من ΣM للجزء ab.','$ Ma − 1.67×4 + 2×2 = 0  →  Ma = 2.68 mt']}
 ]},
 {id:'3-5',ar:'فريمات فيها hinges',en:'Three-hinged frames (Example 14 & Midterm 2021)',slides:'83–85',mins:12,blocks:[
  {t:'lead',x:'الفريم = أعمدة وكمرات. نفس الفكرة: **3 معادلات للفريم كله + معادلة لكل hinge** (لجزء واحد).'},
  {t:'viz',v:'solveEx14'},
  {t:'exam',title:'Final 2022 (T/F) · Final 30/12/2024 · Final 16/01/2025 — 20 marks',x:['ده **أهم مثال في المادة**: جه 3 مرات. مرة T/F ومرتين «Calculate the reaction».','$ Ya = 15 t ↑ · Yc = 17 t ↑ · Xa = 9 t → · Xc = 13 t ← · Xb = 4 t ←','في فاينل 2022 كان فيه عبارة «Yd = 18 t» وإجابتها **False**: مفيش support عند d أصلًا لأن d مجرد hinge، ورد الفعل الرأسي التاني هو Yc = 17 t.']},
  {t:'trap',title:'ليه نبدأ بـ ΣMc؟',x:['التلات supports (a, b, c) **على نفس المنسوب**. يعني كل الـ X بتاعتهم ذراعها **صفر** بالنسبة لأي نقطة على الأرض.','$ ΣMc → only Ya unknown   ·   ΣMa → only Yc unknown','لو بدأت بـ ΣMd أو ΣMe على الفريم كله هتلاقي مجاهيل كتير.']},
  {"t": "tip", "title": "الـ hinge فوق العمود بيعمل إيه؟", "x": ["لو فيه hinge **فوق عمود** (زي c في Midterm 2021 و Examples 15 و 17 و 18)، العمود ده بكل اللي متعلّق فيه بقى **جزء لوحده**.", "خد ΣM حوالين الـ hinge للعمود ده بس: الـ **Y** بتاعة الـ support اللي تحته خط عملها رأسي وبيعدّي من الـ hinge، فعزمها صفر، والمجهول الوحيد هو **X** وذراعه = ارتفاع العمود.", "$ ΣMc (column only) :  X × (column height) − (loads on the column) × (their arms) = 0"]},
  {t:'viz',v:'solveM21'},
  {t:'exam',title:'Midterm 2021 · Q3 — 7 marks',x:['$ Ya = 10 t ↑ · Yb = 17 t ↑ · Xb = 1 t ← · Xa = 11 t ←','الـ hinge فوق العمود B معناه إن **العمود + الكابولي اللي عليه 3t** جزء لوحده → ΣMc ليه بس بتجيب Xb على طول.']},
  {"t": "steps", "title": "Example 15 (من المحاضرة — نفس الفكرة)", "x": [["**المعطيات:** a و b الاتنين hinges على الأرض، وبينهم 8 m. فيه **hinge c** فوق العمود b (ارتفاعه 6 m). الكمرة عليها 1.5 t/m بطول 10 m (من a لحد 2 m بعد b)، وطرفها عليه **2t**. العمود a طالع فوقه 2 m وعليه كابولي 2 m لليمين عليه 1 t/m، يعني **2t** على بعد 1 m من a. والعمود b طالع منه كابولي 1.5 m لليسار على ارتفاع 4 m، عليه **6t**."], ["**ΣMb للفريم كله** عشان Xa و Xb و Yb يختفوا (Xa و Xb على الأرض، و Yb بيعدّي من b). اعتبرنا عكس عقارب الساعة موجب: الأحمال اللي لتحت على **شمال** b بتلف عكس عقارب.", "$ 15×3 + 2×7 + 6×1.5 − 2×2 − Ya×8 = 0  →  Ya = 8 t ↑", "الـ 15t محصلة الكمرة عند منتصفها، يعني 3 m شمال b. الـ 2t اللي على الطرف **يمين** b، فإشارتها عكس الباقي. و Ya لفوق على شمال b بيلف مع عقارب، فإشارته سالبة."], ["**ΣMa للفريم كله** بنفس الطريقة (هنا عقارب الساعة موجب): كل الأحمال على يمين a.", "$ 15×5 + 2×1 + 6×6.5 + 2×10 − Yb×8 = 0  →  Yb = 17 t ↑"], ["**Check:** مجموع الأحمال الرأسية = مجموع ردود الأفعال الرأسية.", "$ 2 + 15 + 6 + 2 − 8 − 17 = 0  ✓"], ["**ΣMc للجزء bc بس** (العمود b والكابولي اللي عليه). Yb خط عمله رأسي وبيعدّي من c فعزمه صفر، فاضل Xb وذراعه 6 m (ارتفاع العمود).", "$ 6×1.5 − Xb×6 = 0  →  Xb = 1.5 t ←", "مفيش أحمال أفقية، فـ ΣX بيدّي **Xa = 1.5 t →**."]]},
  {"t": "steps", "title": "Example 16 (متماثل)", "x": [["**المعطيات:** فريم **متماثل**: الـ supports a و b على الأرض، والـ hinge c في نص الكمرة اللي فوق على ارتفاع 6 m. الكمرة طولها 12 m عليها 2 t/m، وكل كابولي من الناحيتين عليه **4t** على بعد 7.5 m أفقي من c. و a على بعد 3 m أفقي من c."], ["**التماثل:** الأحمال متساوية على الناحيتين، فالـ Y بتاع كل support = نص الأحمال الرأسية.", "$ Ya = Yb = 4 + 2×12/2 = 16 t ↑"], ["**ΣMc للجزء الشمال بس**، لأن العزم عند الـ hinge صفر. الـ 12t = نص حمل الكمرة (2×6) ومحصلته على بعد 3 m من c. Ya على بعد 3 m أفقي من c، و Xa تحت c بـ 6 m.", "$ 4×7.5 + 12×3 − 16×3 − Xa×6 = 0  →  Xa = 3 t ←", "مفيش أحمال أفقية، فـ **Xb = 3 t →**."]]}
 ]},
 {id:'3-6',ar:'فريمات فيها link member',en:'Frames with a link (Examples 17 & 11)',slides:'82, 86–87',mins:12,blocks:[
  {t:'viz',v:'solveEx17'},
  {t:'exam',title:'Final 2024 · Q2 (T/F)',x:['$ Ya = 12 t ↑ · Yd = 12 t ↑ · Xd = 0.67 t → · Xa = 0.67 t ←','الاختيارات كانت: Ya = 9 (F) · Yd = 15 (F) · Xd = 0.67 (T) · Xa = 0.67 (T).']},
  {t:'trap',title:'الإشارة السالبة في المحاضرة',x:['المحاضرة كاتبة **Xd = −0.67** لأنها فرضت Xd لليسار. السالب معناه إن الاتجاه الحقيقي **عكس** الفرض. في الامتحان اكتب القيمة الموجبة والسهم الصح.','$ Xd = −0.67 (assumed ←)  ⇒  Xd = 0.67 t →']},
  {t:'viz',v:'solveEx11'},
  {t:'exam',title:'Final 2023 · Q2 (T/F) — 20 marks',x:['$ Xc = Yc = 7 t · Yd = 5 t ↑ · Ya = 11.5 t ↑ · Yb = 7.5 t ↑ · Xd = 7 t → · Xb = 7 t ←','الاختيارات: Xc = 9 (F) · Yc = 9 (F) · Yd = 5 (T) · Ya = 11.5 (T) · Yb = 9 (F). التصحيح المكتوب على الورقة (Xc = Yc = 7 و Yb = 7.5) مظبوط.']},

 {eq:'ΣMa = 0 :  -4×4 + 8×5 + 12×8 - Yb×10 + 2×12 = 0',r:'Yb = 14.4 t ↑',show:['Yb'],vals:{Yb:'Yb = 14.4 t'},cap:'العزوم حوالين **a** عشان **Xa** و **Ya** بيعدّوا منها فعزمهم صفر، ويفضل مجهول واحد **Yb**. اعتبرنا **عقارب الساعة موجب**: الـ 4t على **شمال** a بـ 4 m بتلف عكس عقارب (سالب). الـ 8t والـ 12t على يمين a بـ 5 و 8 m بيلفوا مع عقارب (موجب). Yb لفوق على يمين a بـ 10 m بيلف عكس عقارب (سالب). والـ 2t على الطرف يمين a بـ 12 m (موجب).'},
 {eq:'ΣMb = 0 :  4×14 - Ya×10 + 8×5 + 12×2 - 2×2 = 0',r:'Ya = 11.6 t ↑',show:['Ya'],vals:{Ya:'Ya = 11.6 t'},cap:'العزوم حوالين **b** عشان نجيب **Ya** لوحده. هنا اعتبرنا **عكس عقارب الساعة موجب**، وده مسموح طالما الاتجاه ثابت جوه المعادلة الواحدة. الـ 4t والـ 8t والـ 12t على **شمال** b بيلفوا عكس عقارب (موجب). Ya لفوق على شمال b بـ 10 m بيلف مع عقارب (سالب). والـ 2t على **يمين** b بـ 2 m بتلف مع عقارب (سالب).'},

 {eq:'Check ΣY :  4 - 11.6 + 8 + 12 - 14.4 + 2 = 0  ✓',r:'',cap:'التشييك بـ **ΣY** (اعتبرنا لتحت موجب): الأحمال الرأسية 4 و 8 و 12 و 2 مجموعها **26t**، وردود الأفعال 11.6 و 14.4 مجموعها **26t**. لو الناتج صفر يبقى الإشارات والأدرع كلها صح.'}]}); };
R.solveEx6=function(el){ V.solver(el,{title:'Example 6 — beam with intermediate hinge c',model:M.ex6,vbW:vbOf('ex6')[0],vbH:vbOf('ex6')[1],intro:'المعطيات: a = **hinge**، b و d = **rollers**، و **c** = intermediate hinge بيقسم الكمرة لجزئين: **abc** و **cd**. الجزء **cd** متسند على الـ hinge من ناحية وعلى d من الناحية التانية، وفيه مجهولين بس (قوة الـ hinge و Yd)، فنبدأ بيه. دوس ▶.',steps:[
 {eq:'Part cd :  ΣMc = 0 →  Yd×2 + 12 = 0',r:'Yd = 6 t ↓',show:['Yd'],vals:{Yd:'Yd = 6 t'},part:[1],lp:[1],cap:'الجزء **cd** لوحده، والعزوم حوالين **c** عشان قوة الـ hinge تختفي. عليه **العزم 12 mt بس** (عكس عقارب الساعة). فرضنا Yd **لفوق** واعتبرنا عكس عقارب موجب، والمعادلة طلّعت Yd **بالسالب 6**: يعني Yd الحقيقي **لتحت 6t**. ده منطقي: العزم لوحده (couple) مايتقاومش غير بـ couple، يعني قوتين متساويتين ومتعاكستين عند c و d.'},
 {eq:'Part cd :  ΣY = 0 →  Yc = 6 t ↑ (on cd)  ⇒  6 t ↓ on abc',r:'',part:[1],lp:[1],cap:'**ΣY على cd**: Yd الحقيقي لتحت 6t، فقوة الـ hinge على cd لازم تبقى **لفوق 6t** عشان الجزء يتزن. وعند نفس المفصل القوة بتتعكس على الجزء التاني (فعل ورد فعل): على **abc** عند c بتبقى **لتحت 6t**.'},
 {eq:'Part abc :  ΣMa = 0 →  6×1.5 + 6×4 - Yb×3 = 0',r:'Yb = 11 t ↑',show:['Yb'],vals:{Yb:'Yb = 11 t'},part:[0],lp:[0],cap:'دلوقتي **abc** لوحده، والعزوم حوالين **a** (عقارب الساعة موجب). عليه: الـ UDL = 2×3 = **6t** عند 1.5 m من a (موجب)، و **6t لتحت** عند c على بعد 4 m من a جاية من cd (موجب)، و Yb لفوق على بعد 3 m بيلف عكس عقارب (سالب).'},

 {eq:'Check ΣY :  11 + 1 - 6 - 6 = 0  ✓',r:'',cap:'التشييك على **abc**: ردود الأفعال (11 و 1) مجموعها 12t = الـ UDL (6t) + القوة اللي جاية من الـ hinge (6t). وعلى الكمرة كلها: Ya و Yb لفوق (12t) و Yd لتحت (6t)، والصافي **6t لفوق** = حمل الـ UDL بالظبط، لأن العزم 12 mt مالوش مركبة رأسية.'}]}); };
R.solveEx7=function(el){ V.solver(el,{title:'Example 7 — fixed end + three hinges',model:M.ex7,vbW:vbOf('ex7')[0],vbH:vbOf('ex7')[1],intro:'المعطيات: a = **fixed** (Xa و Ya و Ma)، و b و c و d = **rollers**. فيه 3 hinges داخلية (**e** و **f** و **g**) بتقسم الكمرة لـ 4 أجزاء: ab و ebf و fg و gcd. الـ 2 t/m ماشي من e لحد c. الجزء **fg** معلّق بين مفصلين ومفيش تحته ولا support، فنبدأ بيه. دوس ▶.',steps:[
 {eq:'Part fg :  UDL 2×3 = 6t  →  3 t at f , 3 t at g',r:'',part:[2],lp:[0],cap:'الجزء **fg** زي كمرة بسيطة متسندة على f و g: الـ UDL عليه 2×3 = **6t** في النص، فكل مفصل **بيزقّه لفوق بـ 3t**. عند كل مفصل القوة بتتعكس على الجزء اللي جنبه: **3t لتحت** على **ebf** عند f، و **3t لتحت** على **gcd** عند g. العكس بيكون بين الجزئين اللي على **نفس المفصل**، مش بين f و g، عشان كده الاتنين لتحت: الجزئين اللي جنب fg شايلينه.'},
 {eq:'Part gcd :  ΣMc = 0 →  5×6 - Yd×4 - 8 - 4×1 - 3×2 = 0',r:'Yd = 3 t ↑',show:['Yd'],vals:{Yd:'Yd = 3 t'},part:[3],cap:'الجزء **gcd**، والعزوم حوالين **c** (عقارب الساعة موجب). الـ **3t لتحت** عند g على شمال c بـ 2 m (سالب). الـ UDL من g لـ c = 2×2 = **4t** عند 1 m شمال c (سالب). العزم **8 mt** عكس عقارب (سالب). Yd لفوق على يمين c بـ 4 m بيلف عكس عقارب (سالب). والـ **5t** على الطرف يمين c بـ 6 m (موجب).'},
 {eq:'Part gcd :  ΣMd = 0 →  3×6 + 4×5 - Yc×4 + 8 - 5×2 = 0',r:'Yc = 9 t ↑',show:['Yc'],vals:{Yc:'Yc = 9 t'},part:[3],cap:'نفس الجزء والعزوم حوالين **d** (عكس عقارب الساعة موجب). الـ 3t عند g على شمال d بـ 6 m (موجب). الـ 4t على شمال d بـ 5 m (موجب). Yc لفوق على شمال d بـ 4 m بيلف مع عقارب (سالب). العزم 8 mt عكس عقارب (موجب). والـ 5t على يمين d بـ 2 m (سالب). تقدر تشيّك: Yc و Yd مع بعض **12t**، وده نفس مجموع الأحمال على gcd (3 و 4 و 5).'},
 {eq:'Part ebf :  ΣMe = 0 →  10×2.5 - 3×Yb + 3×5 = 0',r:'Yb = 13.33 t ↑',show:['Yb'],vals:{Yb:'Yb = 13.33 t'},part:[1],cap:'الجزء **ebf**، والعزوم حوالين **e** عشان قوة الـ hinge e تختفي (عقارب الساعة موجب). الـ UDL = 2×5 = **10t** عند 2.5 m من e (موجب). Yb لفوق على بعد 3 m (سالب). و **3t لتحت** عند f على بعد 5 m (موجب): لتحت لأن ebf هو اللي شايل fg عند f.'},
 {eq:'Part ebf :  ΣY = 0 →  Ye + 13.33 - 10 - 3 = 0',r:'Ye = 0.33 t ↓',part:[1],cap:'**ΣY على ebf**: فرضنا قوة الـ hinge e على ebf **لفوق**، وطلعت **بالسالب 0.33**. يعني القوة الحقيقية على ebf **لتحت 0.33t**، وعلى الجزء **ab** عند e بتتعكس: **لفوق 0.33t**.'},

 {eq:'Part ab :  ΣMe = 0 →  Ma - 1.67×4 + 2×2 = 0',r:'Ma = 2.68 mt',show:['Ma'],vals:{Ma:'Ma = 2.68 mt'},part:[0],cap:'الـ **fixed support** بيدي 3 مجاهيل: Xa و Ya و **Ma**. العزوم حوالين **e** للجزء ab (عكس عقارب الساعة موجب): Ma فرضناه عكس عقارب (موجب)، Ya لفوق على شمال e بـ 4 m بيلف مع عقارب (سالب)، والـ 2t على شمال e بـ 2 m بتلف عكس عقارب (موجب). الناتج موجب، يعني **Ma عكس عقارب الساعة**. القيمة بالظبط 8/3 = 2.67، والـ 2.68 جاية من تقريب 1.67. Check على الكمرة كلها: ردود الأفعال **27t**، والأحمال 2 و 20 و 5 مجموعها **27t** ✓.'}]}); };

    T(g,x1,y0+62,'time →',{s:11.5,c:'var(--ink2)',a:'end'});

    curve=P(g,d,null,'var(--acc)',3.6); V.drawOn(curve,1.3);

    dot=C(g,60,mode===2?246:238,7,'var(--acc)','var(--card)',2.4);

};

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function qMeta(q,label){
  var m='';
  if(label) m+='<span class="pill" dir="ltr">'+esc(label)+'</span>';
  if(q.src && q.src.length) m+=q.src.slice(0,4).map(function(s){ return '<span class="pill y" dir="ltr">'+esc(s)+'</span>'; }).join('')+(q.src.length>4?'<span class="pill y" dir="ltr">+'+(q.src.length-4)+'</span>':'');
  else m+='<span class="pill n">تدريب من المحاضرة</span>';
  if(q.src && q.src.length>=3) m+='<span class="pill o">🔥 متكرر</span>';
  return '<div class="qmeta">'+m+'</div>';
}
function qBody(q){
  var html='<div class="qtext">'+esc(q.q)+'</div>';
  return html;
}
function runner(root,ids,opt){
  opt=opt||{};
  var queue=ids.slice(), round=1, idx=0, results={}, wrongs=[];
  var wrap=h('div',{cls:'runner'}); root.appendChild(wrap);
  function show(){
    if(idx>=queue.length) return endRound();
    var qid=queue[idx], q=QI[qid];
    wrap.innerHTML='';
    var card=h('div',{cls:'qcard fadein'});
    var prog='';
    if(queue.length>1){ prog='<div class="prog">'+queue.map(function(id,i){ var c=i<idx?(results[id+'_'+round]?'ok':'bad'):(i===idx?'cur':''); return '<i class="'+c+'"></i>'; }).join('')+'</div>'; }
    var lbl=(opt.labels&&opt.labels[qid])||(round>1?'إعادة · لفة '+round:(queue.length>1?(idx+1)+' / '+queue.length:''));
    card.innerHTML=prog+qMeta(q,lbl)+qBody(q);
    if(q.fig){ var f=h('div',{cls:'qfig bp'}); f.innerHTML=window.VIZ.figure(q.fig); card.insertBefore(f,card.querySelector('.qtext').nextSibling); }
    var os=h('div',{cls:'opts'+(q.kind==='tf'?' tfopts':'')});
    optsOf(q).forEach(function(t,i){
      var b=h('button',{cls:'opt'},'<span class="l">'+optLetter(q,i)+'</span><span class="ot">'+esc(t)+'</span>');
      b.onclick=function(){ answer(i); };
      os.appendChild(b);
    });
    card.appendChild(os);
    var fb=h('div'); card.appendChild(fb);
    var nav=h('div',{cls:'qnav'}); card.appendChild(nav);
    wrap.appendChild(card);
    function answer(i){
      var ok = q.a===-2 ? true : (Array.isArray(q.a)? q.a.indexOf(i)>=0 : i===q.a);
      $$('.opt',os).forEach(function(b,j){ b.disabled=true; var isA=Array.isArray(q.a)?q.a.indexOf(j)>=0:j===q.a; if(isA) b.classList.add('ok'); else if(j===i) b.classList.add('bad'); });
      results[qid+'_'+round]=ok;
      if(round===1 && !ok) wrongs.push(qid);
      if(round>1 && !ok) wrongs.push(qid);
      record(qid,ok,opt.from);
      var l=LI[q.L];
      fb.innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><div class="h">'+(ok?'✅ صح':'❌ غلط — الإجابة الصح: '+optLetter(q,Array.isArray(q.a)?q.a[0]:q.a)+')')+'</div><div class="ex">'+paras(q.ex)+'</div>'+(l&&!opt.hideLessonLink?'<a class="btn sm l" href="#lesson-'+l.id+'" style="margin-top:6px">📖 ارجع للدرس '+isoNum(l.id)+'</a>':'')+'</div>';
      var nb=h('button',{cls:'btn o'},idx+1<queue.length?'السؤال اللي بعده ←':'خلّصت');
      nb.onclick=function(){ idx++; show(); if(opt.scrollTop!==false) scrollIntoViewIfNeeded(wrap); };
      nav.appendChild(h('span',{cls:'sp'})); nav.appendChild(nb);
      if(opt.onAnswer) opt.onAnswer(qid,ok);
    }
  }
  function endRound(){
    var w=wrongs.filter(function(v,i,a){ return a.indexOf(v)===i; });
    wrongs=[];
    wrap.innerHTML='';
    var card=h('div',{cls:'qcard fadein summary'});
    var total=queue.length, okn=queue.filter(function(id){ return results[id+'_'+round]; }).length;
    if(w.length && !opt.noRetry){
      card.innerHTML='<div class="big">'+okn+'/'+total+'</div><p>غلطت في '+isoNum(w.length)+' — هيرجعولك تاني لحد ما تصلّحهم.</p>';
      var go=h('button',{cls:'btn o'},'يلا نصلّح الغلط ('+w.length+')');
      go.onclick=function(){ round++; queue=shuffle(w); idx=0; show(); };
      var leave=h('button',{cls:'btn l',style:'margin-inline-start:8px'},'سيبهم في النوتة');
      leave.onclick=function(){ finish(); };
      card.appendChild(go); card.appendChild(leave);
    } else {
      card.innerHTML='<div class="big">'+(round===1?okn+'/'+total:'✓')+'</div><p>'+(round===1&&okn===total?'كله صح من أول مرة 🔥':(opt.from==='notebook'?'صلّحتهم من الدفتر، واتنقلوا لـ «اتصلّحوا» 👌':'تمام كده، صلّحتهم في الجولة دي. بس اللي غلطت فيه أول مرة هيفضل في دفتر الغلط لحد ما تحله صح من جوه الدفتر.'))+'</p>';
      finish(card);
    }
    wrap.appendChild(card);
    if(opt.onRound) opt.onRound();
  }
  function finish(card){
    if(opt.onEnd) opt.onEnd();
    if(card && opt.endHtml){ card.appendChild(h('div',{style:'margin-top:10px'},opt.endHtml)); }
    if(!card){ wrap.innerHTML=''; var c=h('div',{cls:'qcard summary'},'<p>اتسجّلوا في نوتة الغلط 📒 تقدر ترجعلهم من زرار ☰.</p>'+(opt.endHtml||'')); wrap.appendChild(c); }
    var again=h('button',{cls:'btn sm l',style:'margin-top:10px'},'↺ حل تاني');
    again.onclick=function(){ root.innerHTML=''; runner(root,ids,opt); };
    (card||wrap.lastChild).appendChild(h('div',{style:'margin-top:8px'})).appendChild(again);
  }
  if(!ids.length){ wrap.innerHTML='<div class="empty">مفيش أسئلة هنا.</div>'; return; }
  show();
}

function quizSet(cid){

  var w=go('<div class="rv-head"><h2>🌙 مراجعة ليلة الامتحان</h2><p class="muted">الملخص ده بيفكّرك بالمنهج كله في قعدة واحدة. كل شابتر فيه أهم النقط، وشيت سريع بالكلمات والأرقام، والفخاخ اللي بتوقع، وأكتر الأسئلة اللي اتكررت في الامتحانات. علّم على كل شابتر تخلّصه، وفي الآخر اختبر نفسك.</p></div>');
  var bar=h('div',{cls:'rv-bar'});
  bar.innerHTML='<div class="seg" role="tablist"><button data-s="mid" class="'+(R.scope==='mid'?'on':'')+'">منهج الميد '+isoNum('1–'+MID_PART_LAST)+'</button><button data-s="all" class="'+(R.scope==='all'?'on':'')+'">المنهج كله '+isoNum('1–'+C.chapters.length)+'</button></div><span class="pill g" id="rvCount"></span><span class="sp"></span><a class="btn sm o" href="#review-run">⏱️ اختبار سريع</a><button class="btn sm l" id="rvPrint">🖨️ اطبعه</button>';
  w.appendChild(bar);
  $$('.seg button',bar).forEach(function(b){ b.onclick=function(){ R.scope=b.dataset.s; save(); vReview(); }; });
  $('#rvPrint',bar).onclick=function(){ $$('details.rv-top',w).forEach(function(d){ d.open=true; }); window.print(); };
  var nav=h('nav',{cls:'rv-nav','aria-label':'الشابترات'}); w.appendChild(nav);
  function chips(){
    nav.innerHTML=chs.map(function(ch){ return '<a href="#review" data-s="rv-'+ch.id+'"><b class="num">'+ch.id+'</b>'+fmt(ch.ar)+'<i class="dot'+(R.seen[ch.id]?' done':'')+'"></i></a>'; }).join('');
    $$('a',nav).forEach(function(a){ a.onclick=function(e){ e.preventDefault(); var t=document.getElementById(a.dataset.s); if(t) window.scrollTo({top:window.scrollY+t.getBoundingClientRect().top-120,behavior:'smooth'}); }; });
    $('#rvCount').textContent='راجعت '+chs.filter(function(c){ return R.seen[c.id]; }).length+' من '+chs.length;
  }
  chips();
  chs.forEach(function(ch){
    var d=(window.REVIEW||{})[ch.id]||{points:[],sheet:[]};
    var traps=[]; ch.lessons.forEach(function(l){ l.blocks.forEach(function(b){ if(b.t==='trap') traps.push({t:b.title,l:l}); }); });
    var top=topRepeated(function(q){ return q.C===ch.id; },5);
    var sec=h('section',{cls:'rv',id:'rv-'+ch.id});
    sec.innerHTML='<div class="rv-h"><span class="n num">'+ch.id+'</span><div class="t"><span class="en" dir="ltr">'+esc(ch.en)+'</span><h2>'+fmt(ch.ar)+'</h2></div><button class="rv-done'+(R.seen[ch.id]?' on':'')+'" aria-pressed="'+!!R.seen[ch.id]+'"><span class="ck">'+ICON.check+'</span><span class="lbl">'+(R.seen[ch.id]?'راجعته':'علّم إنك راجعته')+'</span></button></div>'+
      '<div class="rv-grid"><div class="card rv-box"><h4>أهم النقط</h4>'+rvPoints(d.points)+'</div><div class="rv-side">'+
      '<div class="card rv-box"><h4>شيت سريع</h4><table class="rv-sheet">'+d.sheet.map(function(r){ return '<tr><td><span class="cmds" dir="ltr">'+r[0].split(/\s{2,}/).map(function(x){ return '<code>'+esc(x)+'</code>'; }).join('')+'</span></td><td>'+fmt(r[1])+'</td></tr>'; }).join('')+'</table></div>'+
      (traps.length?'<div class="card rv-box"><h4>فخاخ بتوقع</h4><ul class="rv-traps">'+traps.map(function(x){ return '<li><a href="#lesson-'+x.l.id+'">'+fmt(x.t)+'</a></li>'; }).join('')+'</ul></div>':'')+
      '</div></div>'+(top.length?'<details class="card rv-top"><summary>أكتر '+top.length+' أسئلة اتكررت من الشابتر ده: حلهم وشوف الإجابة</summary><div class="rv-qs"></div></details>':'');
    var QS=$('.rv-qs',sec), dt=$('details',sec);
    if(dt) dt.addEventListener('toggle',function(){ if(dt.open && !QS.children.length) top.forEach(function(q,i){ QS.appendChild(qStatic(q,i+1,'review')); }); });
    var btn=$('.rv-done',sec);
    btn.onclick=function(){ R.seen[ch.id]=!R.seen[ch.id]; save(); btn.classList.toggle('on',!!R.seen[ch.id]); btn.setAttribute('aria-pressed',String(!!R.seen[ch.id])); $('.lbl',btn).textContent=R.seen[ch.id]?'راجعته':'علّم إنك راجعته'; chips(); };
    w.appendChild(sec);
  });
  var end=h('div',{cls:'card rv-end'}); end.innerHTML='<div><h3>خلّصت المراجعة؟</h3><p class="muted">اختبار سريع من أكتر 20 سؤال اتكرروا في '+(R.scope==='mid'?'منهج الميد':'المنهج كله')+'. اللي هتغلط فيه هيرجعلك تاني ويتسجل في دفتر الغلط.</p></div><a class="btn o" href="#review-run">ابدأ الاختبار ←</a>';
  w.appendChild(end);
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ var id=e.target.id; $$('a',nav).forEach(function(a){ a.classList.toggle('on',a.dataset.s===id); }); var a=$('a[data-s="'+id+'"]',nav); if(a&&nav.scrollWidth>nav.clientWidth) nav.scrollLeft=a.offsetLeft-nav.clientWidth/2+a.offsetWidth/2; } }); },{rootMargin:'-30% 0px -60% 0px'});
    $$('.rv',w).forEach(function(x){ io.observe(x); });
    vReview._io&&vReview._io.disconnect(); vReview._io=io;
  }
}
function vReviewRun(){
  var scope=S.rev.scope;
  setCrumbs([['الرئيسية','home'],['مراجعة ليلة الامتحان','review'],['اختبار سريع']]);
  var w=go('<h2>⏱️ اختبار ليلة الامتحان</h2><p class="muted">أكتر 20 سؤال اتكرروا في امتحانات '+(scope==='mid'?'الميد على الشابترات من 1 لـ '+MID_PART_LAST:'المادة كلها')+'، بصيغتها الأصلية. تقدر تغيّر النطاق من صفحة المراجعة.</p>');
  var pool=topRepeated(function(q){ return scope==='all'||CHI[q.C].part===1; },20).map(function(q){ return q.id; });
  var c=h('div',{cls:'card'}), rr=h('div'); c.appendChild(rr); w.appendChild(c);
  runner(rr,shuffle(pool),{from:'review',endHtml:'<a class="btn sm l" href="#review">ارجع للملخص</a>'});
}

/* ---------- router ---------- */
function route(){
  if(vReview._io){ vReview._io.disconnect(); vReview._io=null; }
  if(vChapterAll._off){ vChapterAll._off(); vChapterAll._off=null; }
  clearInterval(timerInt);
  closeDrawer();
  var hs=(location.hash||'#home').slice(1), m;
  if(hs==='home'||hs==='') vHome();
  else if(hs==='chapters') vChapters();
  else if(hs==='how') vHow();
  else if(hs==='mids') vExamList('mid');
  else if(hs==='finals') vExamList('final');
  else if(hs==='papers') vPapers();
  else if(hs==='review') vReview();
  else if(hs==='review-run') vReviewRun();
  else if(hs==='mistakes') vMistakesPage(false);
  else if(hs==='mistakes-run') vMistakesPage(true);
  else if((m=hs.match(/^ch-(\d+)$/))) vChapter(+m[1]);
  else if((m=hs.match(/^chall-(\d+)$/))) vChapterAll(+m[1]);
  else if((m=hs.match(/^lesson-(\d+-\d+)$/))) vLesson(m[1]);
  else if((m=hs.match(/^quiz-(\d+)$/))) vQuiz(+m[1]);
  else if((m=hs.match(/^exam-(\w+)$/))) vExam(m[1]);
  else if((m=hs.match(/^results-(\w+)$/))) vResults(m[1]);
  else if((m=hs.match(/^paper-(\w+)$/))) vPaper(m[1]);
  else vHome();
  updateTop();
}

/* ---------- theme ---------- */
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); $('#themeBtn').innerHTML=t==='dark'?ICON.sun:ICON.moon; }
function init(){
  var app=$('#app');
  app.innerHTML='<header class="top"><button class="ibtn" id="menuBtn" aria-label="menu">'+ICON.menu+'<span class="badge hidden" id="mbadge">0</span></button><a class="brand" href="#home"><i>CE</i><span dir="ltr">Civil Eng</span></a><div class="crumbs" id="crumbs"></div><span id="miniring"></span><button class="ibtn" id="themeBtn" aria-label="theme"></button></header><main id="view2"></main><div class="scrim" id="scrim"></div><aside class="drawer" id="drawer"><div class="dtabs"><button class="dtab" data-t="m">📒 أسئلتي الغلط</button><button class="dtab" data-t="t">🧭 الفهرس</button><button class="ibtn" id="dclose">'+ICON.x+'</button></div><div class="dbody" id="dbody"></div><div class="syncfoot" id="syncFoot" hidden></div></aside><div class="toast" id="toast"></div>';
  view=$('#view2');
  var t='light'; try{ t=localStorage.getItem('civ119-theme')||'light'; }catch(e){}
  applyTheme(t);
  $('#themeBtn').onclick=function(){ var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; applyTheme(n); try{ localStorage.setItem('civ119-theme',n); }catch(e){} if(window.VIZ) window.VIZ.retheme(); };
  $('#menuBtn').onclick=function(){ openDrawer(); };
  $('#dclose').onclick=closeDrawer; $('#scrim').onclick=closeDrawer;
  $$('.dtab').forEach(function(b){ b.onclick=function(){ drawerTab=b.dataset.t; renderDrawer(); }; });
  window.addEventListener('hashchange',route);
  route();
  Cloud.init();
}
window.APP={QI:QI,LI:LI,CHI:CHI,S:function(){return S;},lessonProg:lessonProg,fmt:fmt};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
